<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Disease Prediction</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f2f2f2; padding: 20px; }
        h1 { text-align: center; color: #333; }
        form { 
            max-width: 500px; 
            margin: 0 auto; 
            background: white; 
            padding: 20px; 
            border-radius: 10px; 
            box-shadow: 0 0 10px rgba(0,0,0,0.1); 
        }
        input, select { 
            width: 100%; 
            padding: 8px; 
            margin: 10px 0; 
            border-radius: 5px; 
            border: 1px solid #ccc; 
        }
        button { 
            padding: 10px 15px; 
            background-color: #4CAF50; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            width: 100%;
            font-size: 16px;
        }
        button:hover { background-color: #45a049; }
        .result { 
            text-align: center; 
            margin-top: 20px; 
            font-size: 18px; 
            font-weight: bold; 
        }
    </style>
</head>
<body>
    <h1>Heart Disease Prediction</h1>

    <form id="predictionForm">

        <label>Age:</label>
        <input type="number" name="Age" required>

        <label>Sex:</label>
        <select name="Sex" required>
            <option value="M">Male</option>
            <option value="F">Female</option>
        </select>

        <label>Chest Pain Type:</label>
        <select name="ChestPainType" required>
            <option value="ATA">ATA</option>
            <option value="NAP">NAP</option>
            <option value="ASY">ASY</option>
            <option value="TA">TA</option>
        </select>

        <label>Resting Blood Pressure:</label>
        <input type="number" name="RestingBP" required>

        <label>Cholesterol:</label>
        <input type="number" name="Cholesterol" required>

        <label>Fasting Blood Sugar:</label>
        <select name="FastingBS" required>
            <option value="0">False (≤120 mg/dl)</option>
            <option value="1">True (>120 mg/dl)</option>
        </select>

        <label>Resting ECG:</label>
        <select name="RestingECG" required>
            <option value="Normal">Normal</option>
            <option value="ST">ST</option>
            <option value="LVH">LVH</option>
        </select>

        <label>Max Heart Rate:</label>
        <input type="number" name="MaxHR" required>

        <label>Exercise Induced Angina:</label>
        <select name="ExerciseAngina" required>
            <option value="Y">Yes</option>
            <option value="N">No</option>
        </select>

        <label>Oldpeak (ST Depression):</label>
        <input type="number" step="0.1" name="Oldpeak" required>

        <label>ST Slope:</label>
        <select name="ST_Slope" required>
            <option value="Up">Up</option>
            <option value="Flat">Flat</option>
            <option value="Down">Down</option>
        </select>

        <button type="submit">Predict</button>
    </form>

    <div class="result" id="result"></div>

    <script>
        const form = document.getElementById('predictionForm');
        const resultDiv = document.getElementById('result');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(form);
            const data = {};
            formData.forEach((value, key) => { 
                // convert numeric strings to numbers where appropriate
                data[key] = isNaN(value) ? value : Number(value);
            });

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                resultDiv.textContent = `Prediction: ${result.result}`;
            } catch (error) {
                resultDiv.textContent = 'Error occurred. Please try again.';
            }
        });
    </script>
</body>
</html>
